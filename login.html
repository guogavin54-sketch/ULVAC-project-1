<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ULVAC Login | Secure Access</title>
  
  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-container">
      <!-- Left Brand Area -->
      <div class="login-brand-area">
        <div class="brand-content">
     
          <h1 class="brand-title">ULVAC</h1>
          <p class="brand-tagline">Global Leader in Vacuum Technology</p>
          <div class="brand-visual">
            <div class="visual-circle"></div>
            <div class="visual-circle visual-circle-secondary"></div>
          </div>
        </div>
      </div>

      <!-- Right Login Form -->
      <div class="login-form-area">
        <div class="form-container">
          <div class="form-header">
            <h2>Welcome Back</h2>
            <p>Please enter your credentials to continue</p>
          </div>

          <form id="login-form" class="login-form" autocomplete="off" novalidate>
            <!-- CSRF Token -->
            <input type="hidden" id="csrf-token" name="csrf_token" value="">

            <!-- Error Message -->
            <div id="error-message" class="error-message" role="alert" aria-live="polite" hidden>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#DC2626" stroke-width="2"/>
                <line x1="12" y1="8" x2="12" y2="12" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="1" fill="#DC2626"/>
              </svg>
              <span id="error-text"></span>
            </div>

            <!-- Username Field -->
            <div class="form-group">
              <label for="username" class="form-label">Username / Email</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  class="form-input"
                  placeholder="Enter your username or email"
                  required
                  autocomplete="username"
                >
                <span id="username-error" class="field-error" hidden></span>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-input"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                >
                <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
                  <svg id="eye-icon" class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <svg id="eye-off-icon" class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
                    <path d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.6819 3.96914 7.65661 6.06 6.06M14.12 3.12C13.4417 2.82188 12.7216 2.59559 12 2.65999C5 2.65999 1 10.66 1 10.66C1.68 12.02 2.54 13.27 3.54 14.39M9.88 9.88C9.59856 10.2338 9.40451 10.6516 9.32 11.09C9.23549 11.5284 9.26466 11.9775 9.40401 12.3897C9.54337 12.8019 9.78854 13.1628 10.1134 13.4272C10.4383 13.6915 10.8293 13.8491 11.2378 13.8849C11.6464 13.9208 12.0561 13.8334 12.4205 13.6349M9.88 9.88L3 3M14.12 14.12L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <span id="password-error" class="field-error" hidden></span>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" id="remember-me" name="remember-me">
                <span class="checkbox-custom"></span>
                <span class="checkbox-text">Remember Me</span>
              </label>
            </div>

            <!-- Submit Button -->
    <button type="submit" id="login-button" class="login-button" disabled>
      <span id="button-text">Sign In</span>
      <span id="button-spinner" class="spinner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 9.27455 20.9097 6.80375 19.1414 4.85786" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>

            <!-- Back to Homepage -->
            <div class="form-footer">
              <a href="index.html" class="back-home-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to Homepage
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
